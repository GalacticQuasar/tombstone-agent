[project]
name = "tombstone-agent"
version = "0.1.0"
description = "An agent with the power to forget its own context"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "openai>=1.50",
    "python-dotenv>=1.2.4",
    "tokenizers>=0.23.3",
]

[dependency-groups]
dev = [
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tombstone"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
